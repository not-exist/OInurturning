  # --------------------------------------------------------------------
  - id: direction-charm
    name: 方向锁定符
    category: nurture
    rarity: blue
    effect:
      desc: 下一次洗练时锁定结果家族（在该家族内按常规稀有度权重抽取）；不改变保底计数；可与洗练券/碎片叠用。
