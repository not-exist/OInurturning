      usage_timing: 洗练确认前激活，一次性
    price: null
    sources:
      - R6 天赋异动征兆（消耗品载体，见 events.yaml）
    stack: 10
    description: 替学员卜一卦方向。玄学，但这次是定向的玄学。
  - id: rename-card
    name: 改名卡
    category: nurture
    rarity: green
    effect:
      desc: 使用后可为一名学员更改姓名。
      kind: rename
      target: single_student
      constraints: 每次改名消耗一张，不限改名次数
    price: 600
    sources:
      - 商城
      - 剧情正赛里程碑（CSP-J）
      - 开除学员时概率回收
    stack: 99
    description: 一张烫金卡片。名字是教练给的第一个礼物，也可能是第二个。

  - id: advance-stone
