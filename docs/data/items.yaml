# ======================================================================
# OInurturning 全道具表  docs/data/items.yaml
# 版本 v0.1（2026-08-26）
# 权威依据：GAME-DESIGN.md §5（稀有度）、§6（属性）、§7（天赋）、§13（剧情奖励）、§15（背包分类）
# 稀有度全局统一序列：gray < yellow < green < blue < purple < colorful（严禁红橙）
#
# 字段说明：
#   id          全局唯一英文标识符，运行时主键
#   name        中文显示名
#   category    nurture | book | functional | contest | quest | material
#   rarity      gray | yellow | green | blue | purple | colorful
#   effect.desc 一句话效果说明
#   effect.*    结构化字段：kind 为使用语义枚举，其余按道具类型携带参数
#   price       商城售价（金币）；null 表示不可购买（仅通过途径获取）
#   sources     获取途径数组（事件编号引用 docs/data/events.yaml）
#   stack       单格堆叠上限
#   description 背包内展示的风味文本
#
# effect.kind 枚举：
#   rename / talent_advance / talent_reroll / mentality_add / energy_restore /
#   energy_cap_add / stamina_restore / focus_cap_add / attr_boost /
#   event_defuse / contest_buff / adventure_buff / adventure_insurance /
#   info_preview / recruit_guarantee / account_aura / unlock_tag /
#   pvp_entry / grant_box / choose_grant / compose_input / display
#
# 合成配方（compose_input 类道具的汇总；合成界面读取此处）：
#   old-note-page ×5   → book-{subject}-yellow ×1（九科中随机一科）
#   circuit-board ×3   → firewall ×1
#   reroll-shard  ×10  → reroll-ticket ×1
#   color-shard   ×10  → 随机彩色天赋 ×1
#   reroll-shard  ×10   → reroll-ticket ×1（与 student.md 洗练支付口径一致）
#
# 书籍二分规则（权威 student.md §4.4，集成裁定）：
#   六维书 book-{ds|dp|math|graph|greedy|string}-* —— 仅作定向训练耗材（提供 BookMult），不可直接使用；
#   直用书 book-{thinking|coding|setting}-* —— 背包即用、固定增益（不走训练递减曲线，呼应 GAME-DESIGN §6.2「突破依赖道具」），
#     增益即上表梯度值，受「同学员同属性每周 ≤10 点」约束。
#
# dim-book 虚拟 id（仅 events.yaml 引用）：发放时按所附 rarity 展开为随机科目的对应稀有度六维书。
# 集成新增 effect.kind 枚举：talent_reroll_lock / unlock_passive / passive_income_source / recruit_quality_buff / vendor_sell
#
# 注意：
#   * badge-ngplus-{k}（NG+ 各层全通徽章）为服务端按层生成的陈列勋章，
#     不在本表枚举，见 systems/progression.md §1.8。
#   * advance-stone 与 tag-card 的获取渠道为设计红线，price 必须保持 null。
# ======================================================================

meta:
  version: "0.1"
  updated: "2026-08-26"
  authority: "docs/GAME-DESIGN.md §5 §6 §7 §13 §15"
  rarity_order: [gray, yellow, green, blue, purple, colorful]
