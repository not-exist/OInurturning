      desc: 使一名学员的指定天赋升阶至下一稀有度，必成功。
      kind: talent_advance
      cost_by_target_rarity: {yellow: 1, green: 2, blue: 3, purple: 5, colorful: 8}
      success_rate: 1.0
      constraints: 目标天赋须在 talents.yaml 登记上级形态；彩为顶点不可再进阶
    price: null
    sources:
      - 剧情正赛里程碑（省选×1、NOI×2、CTT×3、IOI 礼盒内含×4，一周目共 10 颗）
      - NG+ 每层全通固定 +5 颗
      - 历练机缘类事件（P2 传奇题卷等）
      - PVP 锦标赛奖励（管理员配置，建议冠军 2 颗）
    stack: 99
    description: 商城不直售的全服稀缺资源。一颗石头，一次命运的抬手。

