# =====================================================================
# OInurturning 天赋家族树数据表
# 权威规格：docs/GAME-DESIGN.md §5/§7；机制细则：docs/systems/student.md
# 本文件同时是策划文档与运行时数据源（API 启动时校验并导入 MySQL）。
# =====================================================================
#
# 【全局规则】
# - 稀有度六档（全局统一序列）：gray 灰 < yellow 黄 < green 绿 < blue 蓝 < purple 紫 < colorful 彩。
#   严禁红/橙。gray 档全部为负面天赋（kind: negative）；yellow 及以上全部非负面。
# - 无天赋是合法且常见的；一名学员拥有多个天赋也合法。（此规则作用于招募/洗练池设计，见 student.md §3.4）
# - 彩色（colorful）天赋效果明显超标，全服稀缺，为传说级。
# - id 规则：{slug}-{rarity}，kebab-case 英文；slug 在全表内唯一。
# - 升阶链唯一：每个天赋至多一个 upgrade_to（直接上级），链条不得分叉或合并；
#   升阶前提是 talents 表登记了上级形态（GAME-DESIGN §7.3），必成功，彩为顶点。
# - 负面家族的链顶（yellow）一律为中性/微正面天赋，即「净化」路径。
# - 家族 family 为 null 的天赋不可升阶（upgrade_to 必为 null）。
#
# 【效果字段】effects 列表：stat + mode(percent|flat) + value。
# stat 允许三类键：
#  (1) 六维：ds 数据结构 / dp 动态规划 / math 数学 / graph 图论 / greedy 贪心 / string 字符串
#      —— percent 修饰比赛与对决中该维的有效值；
#  (2) 全局能力：code 代码能力 / thinking 思维能力 / setting 出题能力
#      —— percent 修饰其有效值；
#  (3) 辅助属性：
#      mindset  心态     —— flat 为「心态日回归基准线偏移」（正=长期乐观/负=长期悲观，详见 student.md §5.1）；
#                           本表不用 percent 形式的 mindset。
#      focus_cap    专注力上限   —— flat 为永久上限增减（属性分值）。
#      energy_max   精力上限     —— flat 为永久上限增减（属性分值）。
#      stamina_regen 体力恢复效率 —— percent 修饰由该属性导出的体力恢复速率（不改属性分值本身）。
# 负面天赋允许负的 percent 值；正面天赋不得含负效果。
#
# 【本文件自定义声明的 meta 键】（effects 中出现的非属性键均在此定义，一句话语义）
# - training_all:        基础/定向/专项训练的主属性收益加成（%）。
# - training_ds / training_dp / training_math / training_graph / training_greedy / training_string:
#                        定向或专项训练命中对应六维时的收益加成（%），与 training_all 乘算叠加。
# - training_code:       训练结算中「代码能力+1」附带触发概率的乘算提升（%）。
# - training_thinking:   训练结算中「思维能力+1」附带触发概率的乘算提升（%）。
# - book_effect:         即时使用类书籍（思维书/代码书/出题书）收益的加成（%）。
# - duel_posing:         出题对决中己方学员所出题目的需求参数上调幅度（%，仅对决内生效）。
# - duel_solve:          出题对决中己方答题三缺口缩小的幅度（%，仅对决内生效）。
# - lecture_income:      讲课报酬加成（%）。
# - focus_gain:          比赛中专注积累速率加成（%，与心态系数 g(m) 乘算）。
# - energy_cost_reduce:  比赛中精力消耗降低（%）。
# - energy_regen:        赛后精力恢复速率加成（%）。
# - wa_penalty_reduce:   WA 罚时时长缩短（%，可为负表示更长）。
# - mindset_loss_reduce: 负向心态变化量的减免（%）。
# - event_luck:          历练事件抽取时高稀有度权重提升（%）。
# - setting_quality:     出题行动所得题目质量评分的加成（%）。
#
