# =============================================================================
# OInurturning 历练事件表（docs/GAME-DESIGN.md §10 底稿的全量字段化）
# version: 0.1.0
#
# 【数量说明 / 与总纲的已知差异】
#   GAME-DESIGN.md 正文两处写「41 条」，但其 §10 底稿表格实际收录 40 条
#   （灰8 + 黄8 + 绿8 + 蓝8 + 紫6 + 彩2 = 40）。本表严格照抄底稿，不增不删不改名，
#   收录 40 条；差异已上报 team-lead 待裁定。
#
# 【排序】一级序 = 稀有度 gray→yellow→green→blue→purple→colorful；
#         二级序 = 体力消耗 1→3；同组内按底稿编号顺序。
#         因此编号顺序为：G1–G8、Y1 Y2 Y3 Y7 Y8、Y4 Y5 Y6、
#         R1–R5 R7 R8、R6、L1 L2 L3 L6 L7 L8、L4 L5、P3、P1 P2 P4 P5 P6、C1 C2。
#
# 【枚举】
#   category: duel=对决 | windfall=奇遇 | trial=试炼 | chance=机缘 | trouble=麻烦 | social=人情
#   rarity:   gray < yellow < green < blue < purple < colorful
#   tiebreak（对决平局分流，算法归 systems/contest.md）:
#     friendly     友谊收场——不计胜负，双方各得安慰奖励
#     by_energy    比较双方剩余精力，多者胜
#     by_quality   比较本场出题质量分，高者胜
#     sudden_death 进入加赛突然死亡局，先失分者负
#   outcome.type:
#     duel   出题对决（duel 块只含参数，内部算法归 contest.md；
#            quality_rule=true 表示启用【考察出题质量】：答题方未解出 → 出题方 +2）
#     check  属性检定（p_success = sigmoid((S−DC)/12)，S 含天赋修正；
#            grades 按 margin/solved/passed 分档取首个满足项，rewards_fail 为保底档）
#     fixed  无判定直接结算
#
# 【字段字典】
#   repeatable        false 的事件受 once_per_student / server_weekly_limit 约束
#   cooldown_days     账号级单事件冷却（现实时间，懒结算）；0 = 无冷却
#   weight            组内权重：同稀有度同体力层内相对占比（各组内部和为 100）。
#                     最终概率 = 层权重[投入档][rarity] × weight ÷ Σ组内权重
#                     （层权重见 gameplay.md §3.2：−1{gray70,yellow30}
#                       −2{yellow42,green34,blue20,purple4} −3{green25,blue35,purple31,colorful9}）
#   requirements      抽取前置过滤：min_stat.{six_max}（最高单维六维）、min_reputation 等，
#                     不满足则该事件根本不进池
#   choices[].requires_item / consume   选择分支的道具门槛与自动消耗
#   choices[].cost_money              选择即支付的钱（不足则无法选择）
#   rewards* 字段：
#     money/reputation  int 或 {min,max}，负数为支出
#     items             [{id, qty, prob}]，prob 缺省 1.0；id: dim-book 表示
#                       「随机维度的六维书」（rarity 指定书的稀有度，真实 id 由 items.yaml 落地）
#     stat_gain         {<attr>: int|{min,max}}；特殊键 all_six（六维各+）、chosen_skill
#                       （玩家在 code/thinking/单一六维中自选）；配 target_student:
#                       participant(默认)|random_own|chosen
#     buffs             [{target, stat?, bonus?|effect?, duration}]（duration 单位为次数）
#     energy_cost       额外精力消耗
#     bank_add          预制题入库 {count:{min,max}} 或 {quality_mult}，quality 为质量分区间
#     recruit           特殊招募结算 {quality_tier, success_prob, on_success, on_fail}
#                       （签约金由 choices[].cost_money 支付，on_fail.money 为退款）
# =============================================================================

