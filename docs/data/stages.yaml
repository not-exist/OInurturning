# =============================================================================
# 一周目全通奖励（GAME-DESIGN §13.2 末尾）
# =============================================================================
full_clear:
  condition: 一周目（k=0）八章全部「正赛」通关
  money: 500000            # 「大额结算金」（权威数值：economy.yaml → story.full_clear_gold）
  items:
    - { item: badge-legend, count: 1 }   # 传奇教练勋章（规范 id，账号永久声誉获取 +10%）
  unlocks: ng_plus         # 解锁 NG+

# =============================================================================
# NG+ 与重复通关参数（GAME-DESIGN §13.3；k 为 NG+ 层号，k≥1，一周目 k=0）
# 引擎注入点见 docs/systems/contest.md §3.13
# =============================================================================
ng_plus:
  layer_param: k
  demand_multiplier: "1 + 0.15*k"              # 题目 D/M/C 数值需求乘数
  trait_chance_bonus: "0.10*k"                 # 特性出现概率加成
  trait_pool_shift:                            # 特性等级池上移
    weight_scale: "1 + 0.10*k"                 # 所有条目权重放大（隐式无特性权重不变）
    high_severity_extra:
      min_severity: blue                       # severity ≥ blue 的条目额外再乘
      scale: "1 + 0.05*k"
      cap: colorful                            # 彩封顶
  first_clear_money_multiplier: "1 + 0.5*k"    # 首通钱奖励乘数（仅钱部分）
  item_rarity_shift:
    from_layer: 2                              # k≥2 起道具池稀有度上移一档
    shift: 1
    cap: colorful
  milestone_rule: >
    NG+ 层沿用各章正赛里程碑，但其中进阶石类（advance-stone）与传说礼盒（legend-box）
    不重复发放——进阶石收益改由每层全通固定 +5 承担（不参与任何乘算）；
    其余里程碑道具照常发放、数量不变。
  advance_stone_per_layer_clear: 5             # 每层全通固定 +5 颗进阶石
  layer_badge:
