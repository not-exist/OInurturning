# =============================================================================
# OInurturning 剧情模式关卡配置（stages.yaml）
# 依据：docs/GAME-DESIGN.md §8.1 / §13；引擎算法见 docs/systems/contest.md §3
# 本文件同时是策划文档与运行时数据源：API 启动时校验并导入 MySQL 配置表 stages。
#
# 结构：8 章（cspj/csps/noip/province/noi/ctt/cts/ioi）共 33 关。
# 关数严格按 GAME-DESIGN §13.2：CSP-J 4 / CSP-S 4 / NOIP 5 / 省选 5 / NOI 5 / CTT 3 / CTS 3 / IOI 4。
# 关名序列按关数取：热身赛 → 模拟赛Ⅰ…Ⅲ → 正赛。
# =============================================================================

version: 1
updated: '2026-08-26'

# -----------------------------------------------------------------------------
# 全局默认（每关继承，可被单关覆盖）
# -----------------------------------------------------------------------------
defaults:
  engine_ref: docs/systems/contest.md        # 排名制模拟赛 §3 全流程
  stamina_cost_by_chapter: { cspj: 1, csps: 1, noip: 1, province: 1, noi: 2, ctt: 2, cts: 2, ioi: 2 }   # 参赛体力：第1–4章1点、第5–8章2点（progression.md 口径）
  pass_rank_max: 8                            # 通关线：固定前 8 名（与 NPC 池规模解耦；名次奖金同门槛）
  # 题目实例化规则：
  #   * problem_slots 各组按序抽取，同一场内模板不重复（池不足时允许复用）；
  #   * 带 chance 的组为概率附加题（超纲题），未触发则本场少一题；
  #   * 带 dims 的组限定从指定主考维的模板中抽取；
  #   * 特性按 problems.yaml trait_pool 权重抽取（隐式无特性权重 30）。
  # 首通道具池为「稀有度池」：由战利品系统从 items.yaml 中对应稀有度道具里加权抽选，
  # 不写死具体道具 id，避免与 items.yaml 双处维护。

