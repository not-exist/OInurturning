name: oinur

services:
  mysql:
    image: mysql:8.4
    container_name: oinur-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oinur}
      MYSQL_USER: ${MYSQL_USER:-oinur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    container_name: oinur-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_DIR: /app/config
      # 限流参数透传（T5.4）：.env 未设时即基线，与 apps/api/src/config/env.ts 默认值一致
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
    depends_on:
      mysql: { condition: service_healthy }   # 健康后才启动；启动脚本再跑 migrate deploy
    expose: ["3000"]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  nginx:
    build: { context: .., dockerfile: deploy/web.Dockerfile }   # 多阶段：vite build → nginx 托管产物
    container_name: oinur-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  dbdata:
