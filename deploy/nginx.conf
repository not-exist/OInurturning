# 在 nginx 后还有 TLS 终结层时保留它传入的协议；直连本 nginx 时取本连接协议。
map $http_x_forwarded_proto $oinur_forwarded_proto {
  ''      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 外层 TLS 反代已提供协议时保留它；否则（直连本 nginx）使用本连接协议。
    proxy_set_header X-Forwarded-Proto $oinur_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
