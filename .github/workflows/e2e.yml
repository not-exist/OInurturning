# E2E gate: API journey (supertest) + browser e2e (Playwright).
# Runs on main pushes and every PR. Playwright webServer boots API (oinur_e2e db) and web.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

# 同分支/同 PR 的连续推送不再堆积排队（§R0）
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: oinur
          MYSQL_PASSWORD: oinur
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Journey db: vitest global-setup hard-resets oinur_test, DATABASE_URL must point at it
      DATABASE_URL: mysql://oinur:oinur@127.0.0.1:3306/oinur_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef-e2e-only
      # Playwright db: shared by the API server and e2e:seed
      E2E_DATABASE_URL: mysql://oinur:oinur@127.0.0.1:3306/oinur_e2e
      E2E_JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef-only
    steps:
      - uses: actions/checkout@v7
      # 不传 version：由根 package.json 的 packageManager 决定，避免两处真源漂移
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/api generate
      - name: Grant test user and create e2e database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'oinur'@'%'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS oinur_e2e;"
      - name: Migrate e2e database
        run: DATABASE_URL="$E2E_DATABASE_URL" pnpm -C apps/api migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:typecheck
      - name: API journey
        run: pnpm -C apps/api test:e2e -- --reporter=default --reporter=github-actions 2>&1 | tee journey.log; test ${PIPESTATUS[0]} -eq 0
      - name: Browser e2e
        run: pnpm e2e
      # 失败上传诊断产物。原先的 boot-capture + locate-*（约 50 行）在失败时重启服务、
      # 轮询端口、又用 JSTAGE 关键做正向断言，但 playwright 的 trace/screenshot 已覆盖；
      # 且上传列表里 /tmp/api-poll.log 从未被任何步骤创建（真实产物是 /tmp/dual-poll.log）。
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            journey.log
          if-no-files-found: ignore
          retention-days: 7
