# e2e 测试：API 全链路旅程（supertest）+ 浏览器 e2e（Playwright）。
# 每次 push/PR 全量运行。Playwright 用自带 webServer 拉起 API（oinur_e2e 库）与 web。
name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: oinur
          MYSQL_PASSWORD: oinur
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # API 旅程库：vitest global-setup 硬编码重建 oinur_test，DATABASE_URL 须指向它
      DATABASE_URL: mysql://oinur:oinur@127.0.0.1:3306/oinur_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef-e2e-only
      # Playwright 链路库：API 服务器 + e2e:seed 共用
      E2E_DATABASE_URL: mysql://oinur:oinur@127.0.0.1:3306/oinur_e2e
      E2E_JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/api generate
      - name: 授权测试用户并创建 e2e 库
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'oinur'@'%'; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS oinur_e2e;"
      - name: 迁移 e2e 库
        run: DATABASE_URL="$E2E_DATABASE_URL" pnpm -C apps/api migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:typecheck
      - name: API 全链路旅程
        run: pnpm -C apps/api exec vitest run tests/journey-full.e2e.test.ts
      - name: 浏览器 e2e
        run: pnpm e2e
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            journey.log
          retention-days: 7
