# Unit/integration gate: typecheck + lint + build + API tests (excludes *.e2e.test.ts).
# See e2e.yml for the e2e suite. Runs on main pushes and every PR.
name: test

on:
  push:
    branches: [main]
  pull_request:

# 同分支/同 PR 的连续推送不再堆积排队（§R0）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: oinur
          MYSQL_PASSWORD: oinur
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://oinur:oinur@127.0.0.1:3306/oinur_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef-test-only
    steps:
      - uses: ./.github/actions/ci-setup
      - name: Grant test user privileges
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'oinur'@'%'; FLUSH PRIVILEGES;"
      - name: Collect typecheck output
        run: pnpm -r typecheck 2>&1 | tee typecheck.log; test ${PIPESTATUS[0]} -eq 0
      - run: pnpm lint
      - run: pnpm -r build
      - name: Unit tests (pure, no DB, parallel)
        run: |
          set -o pipefail
          pnpm --filter @oinur/api test:unit -- --reporter=default --reporter=github-actions 2>&1 | tee unit-test.log
      - name: Integration tests (DB, serial)
        run: |
          set -o pipefail
          pnpm --filter @oinur/api test:integration -- --reporter=default --reporter=github-actions 2>&1 | tee integration-test.log
      # 失败时上传全量日志。原先这里在 upload 之前就 rm 掉 unit/integration 日志、
      # 又只传 typecheck 两类，导致真正的测试失败日志从未落盘（§R0）。
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-logs
          path: |
            typecheck.log
            unit-test.log
            integration-test.log
          if-no-files-found: ignore
          retention-days: 7
