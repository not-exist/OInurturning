name: 'CI setup'
description: 'Install the pinned toolchain and install + generate Prisma. Shared by test.yml and e2e.yml so the setup never drifts between them. Requires the caller to run actions/checkout first (local actions cannot be resolved before checkout).'
inputs:
  # 预留：若某条 workflow 需要不同的 node 版本可覆盖；缺省用根 packageManager 与 node 26。
  node-version:
    description: 'Node version to build with'
    required: false
    default: '26'
runs:
  using: 'composite'
  steps:
    # 不传 version：由根 package.json 的 packageManager 决定，避免两处真源漂移
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm -C apps/api generate
      shell: bash
